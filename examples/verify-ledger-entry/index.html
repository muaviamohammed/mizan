<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify a MIZAN ledger entry</title>
<style>
  :root { color-scheme: light dark; --ok:#1a7f37; --no:#cf222e; --dim:#6e7781; }
  body { font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; max-width: 46rem; margin: 2.5rem auto; padding: 0 1rem; }
  h1 { font-size: 1.35rem; margin-bottom: .25rem; }
  p.lead { color: var(--dim); margin-top: 0; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1.25rem 0; }
  input { font: inherit; padding: .4rem .6rem; width: 8rem; }
  button { font: inherit; padding: .4rem .9rem; cursor: pointer; }
  pre { font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1rem; border: 1px solid #8884; border-radius: 6px; white-space: pre-wrap; }
  .ok { color: var(--ok); } .no { color: var(--no); } .dim { color: var(--dim); }
</style>
</head>
<body>
<h1>Verify a MIZAN ledger entry in your browser</h1>
<p class="lead">The entry is recomputed from its contents, folded up to the signed ledger head (RFC 6962), and the head's Ed25519 signature is checked against MIZAN's published key. Your browser does the math.</p>
<form id="f"><input id="ix" type="number" min="0" placeholder="newest"><button>Verify</button></form>
<pre id="out" class="dim">Pick an entry number, or leave it empty for the newest.</pre>
<script>
"use strict";
const API = "https://studio.mizan.market";

// mizan-canon/1, byte-identical to Python json.dumps(sort_keys=True, separators=(",",":"), ensure_ascii=False).
// Numbers are kept exactly as the server wrote them (JSON.parse would turn 150.0 into 150).
class RawNumber { constructor(t) { this.text = t; } }
function parseRaw(text) {
  let i = 0;
  const ws = () => { while (" \t\n\r".includes(text[i]) && i < text.length) i++; };
  const str = () => { const s = i++; while (text[i] !== '"') { if (text[i] === "\\") i++; i++; } i++; return JSON.parse(text.slice(s, i)); };
  const val = () => {
    ws(); const c = text[i];
    if (c === "{") { i++; const o = {}; ws(); if (text[i] === "}") { i++; return o; }
      for (;;) { ws(); const k = str(); ws(); i++; o[k] = val(); ws(); if (text[i++] === "}") return o; } }
    if (c === "[") { i++; const a = []; ws(); if (text[i] === "]") { i++; return a; }
      for (;;) { a.push(val()); ws(); if (text[i++] === "]") return a; } }
    if (c === '"') return str();
    for (const [w, v] of [["true", true], ["false", false], ["null", null]]) if (text.startsWith(w, i)) { i += w.length; return v; }
    const m = /^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?/.exec(text.slice(i, i + 64)); i += m[0].length; return new RawNumber(m[0]);
  };
  return val();
}
function canon(o) {
  if (o instanceof RawNumber) return o.text;
  if (o === null || typeof o !== "object") return JSON.stringify(o);
  if (Array.isArray(o)) return "[" + o.map(canon).join(",") + "]";
  return "{" + Object.keys(o).sort().map(k => JSON.stringify(k) + ":" + canon(o[k])).join(",") + "}";
}
const n = x => x instanceof RawNumber ? Number(x.text) : x;
const enc = new TextEncoder();
const hex = b => Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, "0")).join("");
const unhex = h => Uint8Array.from(h.match(/../g), x => parseInt(x, 16));
const cat = (...a) => { const o = new Uint8Array(a.reduce((s, x) => s + x.length, 0)); let p = 0; for (const x of a) { o.set(x, p); p += x.length; } return o; };
const sha = async u => new Uint8Array(await crypto.subtle.digest("SHA-256", u));
const getRaw = async path => { const r = await fetch(API + path); if (!r.ok) throw new Error(path + ": HTTP " + r.status); return parseRaw(await r.text()); };

async function verifyEntry(ix) {
  const d = await getRaw("/api/log/proof/" + ix);
  const out = []; let ok = true;
  const mark = (pass, t) => { ok = ok && pass; out.push(`<span class="${pass ? "ok" : "no"}">${pass ? "✓" : "✗"}</span> ${t}`); };

  const leaf = {}; for (const k of Object.keys(d.leaf)) if (k !== "index" && k !== "leaf_hash") leaf[k] = d.leaf[k];
  const lh = await sha(cat(new Uint8Array([0]), enc.encode(canon(leaf))));
  mark(hex(lh) === d.leaf_hash, `Entry #${n(d.index)} recomputed from its contents: ${hex(lh).slice(0, 16)}…`);

  let fn = n(d.index), sn = n(d.size) - 1, r = lh;
  for (const ph of d.path) {
    const p = unhex(ph);
    if ((fn & 1) || fn === sn) { r = await sha(cat(new Uint8Array([1]), p, r)); if (!(fn & 1)) while (!((fn & 1) || fn === 0)) { fn >>= 1; sn >>= 1; } }
    else r = await sha(cat(new Uint8Array([1]), r, p));
    fn >>= 1; sn >>= 1;
  }
  const h = d.head;
  mark(sn === 0 && hex(r) === h.root, `Folded ${d.path.length} hashes up to the ledger head ${h.root.slice(0, 16)}… (${n(h.size)} entries)`);

  try {
    const keys = await getRaw("/.well-known/mizan-keys.json");
    const k = keys.keys.find(x => x.alg === "Ed25519" && x.key_id === h.signature.key_id);
    const pk = await crypto.subtle.importKey("raw", Uint8Array.from(atob(k.public_key_b64), c => c.charCodeAt(0)), { name: "Ed25519" }, false, ["verify"]);
    const sig = Uint8Array.from(atob(h.signature.sig_b64), c => c.charCodeAt(0));
    const core = { alg: h.alg, log: h.log, root: h.root, size: h.size, ts: h.ts };
    mark(await crypto.subtle.verify({ name: "Ed25519" }, pk, sig, enc.encode(canon(core))), `Head signature checked against MIZAN's published key (${h.signature.key_id})`);
  } catch (e) {
    out.push(`<span class="dim">·</span> Head signature: this browser cannot check Ed25519 itself (${String(e.message || e).slice(0, 60)}); run verify.mjs instead`);
  }

  const a = h.anchor || {};
  if (a.rfc3161_time_utc && n(a.head_size) > n(d.index)) out.push(`<span class="ok">✓</span> Covered by an outside timestamp authority's stamp at ${String(a.rfc3161_time_utc).replace("T", " ").slice(0, 16)} UTC`);
  else out.push(`<span class="dim">·</span> Newer than the last outside stamp; covered by the next hourly one`);
  out.push(`<span class="dim">${ok ? "Nothing here asked you to trust MIZAN. Your browser did the math." : "Verification failed."}</span> <a href="${API}/api/log/proof/${n(d.index)}">raw proof</a>`);
  return out.join("\n");
}

document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const out = document.getElementById("out"); out.className = ""; out.textContent = "verifying…";
  try {
    let ix = document.getElementById("ix").value;
    if (ix === "") ix = n((await getRaw("/api/log/head")).size) - 1;
    out.innerHTML = await verifyEntry(Number(ix));
  } catch (e) { out.innerHTML = `<span class="no">Could not fetch the proof: ${String(e.message || e)}</span>`; }
});
</script>
</body>
</html>
