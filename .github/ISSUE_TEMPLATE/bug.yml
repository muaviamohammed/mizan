name: Bug
description: A client, example or verifier in this repository does something wrong, or the live API answers unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "The exact request (no keys), what you expected, what you got." }
    validations: { required: true }
  - type: input
    id: check_id
    attributes: { label: check_id or ledger index, description: "From the reply, if there is one." }
  - type: input
    id: when
    attributes: { label: Time (UTC) }
  - type: input
    id: env
    attributes: { label: Environment, description: "Package and version, language runtime, OS." }
