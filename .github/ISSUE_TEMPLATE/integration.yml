name: Integration request
description: Ask for (or offer) MIZAN in a framework, protocol, wallet or platform.
labels: [integration]
body:
  - type: input
    id: target
    attributes:
      label: Framework, protocol or platform
      placeholder: "e.g. a wallet SDK, an agent framework, a payment protocol"
    validations: { required: true }
  - type: textarea
    id: moment
    attributes:
      label: Where should the check happen?
      description: The moment just before value moves (pay, hire, release, allocate, list).
    validations: { required: true }
  - type: textarea
    id: notes
    attributes:
      label: Anything else
