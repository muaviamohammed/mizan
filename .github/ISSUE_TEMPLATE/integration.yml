name: Integration
description: Propose an example or client for a payment rail, marketplace, agent framework or language.
labels: [integration]
body:
  - type: input
    id: target
    attributes: { label: Rail, platform, framework or language }
    validations: { required: true }
  - type: dropdown
    id: hook
    attributes:
      label: Hook
      options: [release guard, x402 payment field, marketplace listing, platform deploy, questionnaire, code gate, other]
    validations: { required: true }
  - type: textarea
    id: sketch
    attributes: { label: Sketch, description: "Where the check goes, what happens on ALLOW and on REFUSE, advise or enforce." }
