name: live
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install cryptography pytest
      - run: sh examples/run-all.sh
      - run: python3 -m pytest -q packages/python/tests/test_offline.py
  typescript:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test test/offline.test.ts test/live.test.ts
